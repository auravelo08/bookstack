default:
  tags:
    - bs-runner-3

stages:
  - build
  - deploy

variables:
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

build:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "🔐 Login registry"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    - echo "📦 Pull cache image (if exists)"
    - docker pull "$IMAGE_LATEST" || true

    - echo "🏗️ Build image with cache"
    - docker build \
      --cache-from "$IMAGE_LATEST" \
      -t "$IMAGE_LATEST" \
      -t "$IMAGE_SHA" \
      -f dev/docker/Dockerfile \
      .

    - echo "⬆️ Push images"
    - docker push "$IMAGE_LATEST"
    - docker push "$IMAGE_SHA"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SWARM_MANAGER_IP" >> ~/.ssh/known_hosts

  script:
    - echo "📤 Upload stack file"
    - scp docker-stack.yml ubuntu@$SWARM_MANAGER_IP:/home/ubuntu/docker-stack.yml

    - echo "♻️ Force update service to pull new image"
    - ssh ubuntu@$SWARM_MANAGER_IP "docker service update --with-registry-auth --force bookstack_app || true"

    - echo "🚀 Deploy stack"
    - ssh ubuntu@$SWARM_MANAGER_IP "docker stack deploy --with-registry-auth -c /home/ubuntu/docker-stack.yml bookstack"

    - echo "📋 Services"
    - ssh ubuntu@$SWARM_MANAGER_IP "docker service ls"

    - echo "📦 Stack status"
    - ssh ubuntu@$SWARM_MANAGER_IP "docker stack ps bookstack"
