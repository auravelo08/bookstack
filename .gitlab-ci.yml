locust:
  stage: load-testing
  image: python:3.11-slim
  script:
    - pip3 install locust beautifulsoup4
    - locust --headless -f locustfile.py --users 55 --spawn-rate 10 -H http://bookstack-alb-2030915568.eu-north-1.elb.amazonaws.com -t 5s --only-summary

