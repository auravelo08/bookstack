default:
  tags:
    - bs-runner-3

stages:
  - units-test
  # - build
  # - deploy
  # - quality
  # - load-testing

variables:
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

unit-test:
  stage: units-test
  image: php:8.2-fpm
  variables:
    APP_ENV: testing
    DB_CONNECTION: mysql
    DB_HOST: shared-bookstack-keycloak-rds.crogwcggglt8.eu-north-1.rds.amazonaws.com
    DB_PORT: 3306
    DB_DATABASE: bookstack_test
    DB_USERNAME: dbadmin
    # Assure-toi que DB_PASSWORD et APP_KEY sont bien définis dans GitLab CI/CD Settings
  before_script:
    - apt-get update && apt-get install -y libpng-dev libzip-dev zip unzip libicu-dev git
    - docker-php-ext-install gd zip pdo_mysql intl
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-interaction --no-progress

    # CRÉATION DYNAMIQUE DU .env (Indispensable pour Laravel en CLI)
    - |
      echo "APP_ENV=$APP_ENV" > .env
      echo "APP_KEY=$APP_KEY" >> .env
      echo "DB_CONNECTION=$DB_CONNECTION" >> .env
      echo "DB_HOST=$DB_HOST" >> .env
      echo "DB_PORT=$DB_PORT" >> .env
      echo "DB_DATABASE=$DB_DATABASE" >> .env
      echo "DB_USERNAME=$DB_USERNAME" >> .env
      echo "DB_PASSWORD=\"$DB_PASSWORD\"" >> .env

  script:
    # On efface le cache au cas où une ancienne config traînerait
    - php artisan config:clear
    # Ajout du --seed pour remplir la base avec les données nécessaires aux tests
    - php artisan migrate:fresh --seed --force
    # Augmentation de la mémoire PHP pour éviter le crash en fin de suite
    - php -d memory_limit=512M artisan test

