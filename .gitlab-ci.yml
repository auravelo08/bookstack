deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SWARM_KNOWN_HOSTS" >> ~/.ssh/known_hosts

  script:
    - echo "[INFO] Starting remote deployment..."
    - |
      ssh -o IdentitiesOnly=yes ubuntu@"$SWARM_MANAGER_IP" bash << EOF
      set -e
      # 1) Préparation
      sudo mkdir -p /home/ubuntu/deploy
      sudo chown ubuntu:ubuntu /home/ubuntu/deploy

      # 2) Upload du fichier (Via cat local vers stdin distant)
      cat > /home/ubuntu/deploy/docker-stack.yml

      # 3) Création du .env (utilisation de variables locales injectées ici)
      cat > /home/ubuntu/deploy/.env << EON
      DB_PASSWORD=${DB_PASSWORD}
      STORAGE_S3_SECRET=${STORAGE_S3_SECRET}
      APP_KEY=${APP_KEY}
      S3_KEY=${S3_KEY}
      EON

      # 4) Déploiement
      docker stack deploy --with-registry-auth -c /home/ubuntu/deploy/docker-stack.yml bookstack

      # 5) Nettoyage
      rm -f /home/ubuntu/deploy/.env

      # 6) Vérification
      docker stack ps bookstack --no-trunc
      EOF < docker-stack.yml

