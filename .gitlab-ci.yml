default:
  tags:
    - bs-runner-3

stages:
  - units-test
  # - build
  # - deploy
  # - quality
  # - load-testing

variables:
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

unit-test:
  stage: units-test
  image: php:8.2-fpm
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  before_script:
    # --- AJOUTEZ libsqlite3-dev ICI ---
    - apt-get update && apt-get install -y libpng-dev libzip-dev zip unzip libicu-dev libsqlite3-dev
    - docker-php-ext-install gd zip pdo_mysql pdo_sqlite intl

    # Installation de Composer
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-interaction

    # Préparation
    - cp .env.example .env
    - php artisan key:generate
  script:
    - php artisan test

