default:
  tags:
    - bs-runner-3

stages:
  - build
  - test
  - deploy
  - quality

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

test-units:
  stage: test
  image: php:8.2
  variables:
    DB_CONNECTION: mysql
    DB_HOST: shared-bookstack-keycloak-rds.crogwcggglt8.eu-north-1.rds.amazonaws.com
    DB_PORT: 3306
    DB_DATABASE: bookstack_production
    DB_USERNAME: dbadmin
    DB_PASSWORD: bsCapsRdsPwd
  script:
    - apt-get update && apt-get install -y unzip git libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install gd pdo_mysql zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
    - until mysqladmin ping -h"$DB_HOST" -u"$DB_USERNAME" -p"$DB_PASSWORD" --silent; do echo "Waiting for RDS..."; sleep 5; done
    - php artisan key:generate
    - php artisan migrate --force
    - ./vendor/bin/phpunit --configuration phpunit.xml
  allow_failure: true

build:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE" -f dev/docker/Dockerfile .
    - docker push "$IMAGE"

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SWARM_MANAGER_IP >> ~/.ssh/known_hosts
  script:
    - scp docker-stack.yml ubuntu@$SWARM_MANAGER_IP:/home/bookstack/deploy-stack.yml
    - ssh ubuntu@$SWARM_MANAGER_IP "docker stack deploy -c /home/bookstack/deploy-stack.yml bookstack"
