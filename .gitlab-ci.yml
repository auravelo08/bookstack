default:
  tags: 
    - bs-runner-2

stages:
  - test
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
#   PLATFORMS: linux/amd64,linux/arm64

test-units:
  stage: test
  image: composer:2
  script:
    - composer install --ignore-platform-reqs
  allow_failure: true

build:
  stage: build
  # image: docker:24
  # services:
  #   - name: docker:24-dind
  # variables:
  #   DOCKER_TLS_CERTDIR: ""
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE .
    - docker push $IMAGE


deploy: 
  stage: deploy
  script:
    - echo "déploiement au sprint1"

