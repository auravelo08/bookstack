deploy:
  stage: deploy
  image: alpine:latest
  # rules:
  #   - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    # Ajouter le saut de ligne manquant avec echo
    - (echo "$SSH_PRIVATE_KEY" | tr -d '\r'; echo) | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SWARM_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    # 1) On s'assure de la propriété du dossier sans écraser les fichiers existants
    - ssh -o StrictHostKeyChecking=accept-new ubuntu@"$SWARM_MANAGER_IP" "sudo chown -R ubuntu:ubuntu /home/ubuntu/deploy"

    # 2) Upload du stack file (on force l'écrasement si nécessaire)
    - echo "[INFO] Uploading docker-stack.yml..."
    - scp -o StrictHostKeyChecking=accept-new docker-stack.yml ubuntu@"$SWARM_MANAGER_IP":/home/ubuntu/deploy/docker-stack.yml

    # 3) Génération du fichier .env
    # Note: On utilise un fichier temporaire pour éviter les problèmes de droits lors de la création
    - echo "[INFO] Creating .env file on remote..."
    - ssh ubuntu@"$SWARM_MANAGER_IP" "
      set -e
      cat <<EOF > /home/ubuntu/deploy/.env
      DB_PASSWORD=${DB_PASSWORD}
      STORAGE_S3_SECRET=${STORAGE_S3_SECRET}
      APP_KEY=${APP_KEY}
      S3_KEY=${S3_KEY}
      EOF
      "

    # 4) Déploiement du stack
    # On précise bien le chemin du fichier .env dans la commande si nécessaire
    # ou on s'assure que le stack file le charge bien (env_file: .env)
    - echo "[INFO] Deploying stack..."
    - ssh ubuntu@"$SWARM_MANAGER_IP" "
      set -e
      export $(cat /home/ubuntu/deploy/.env | xargs)
      docker stack deploy --with-registry-auth -c /home/ubuntu/deploy/docker-stack.yml bookstack
      "

    # 5) Nettoyage et vérification
    - ssh ubuntu@"$SWARM_MANAGER_IP" "rm -f /home/ubuntu/deploy/.env"
    - ssh ubuntu@"$SWARM_MANAGER_IP" "docker stack ps bookstack --no-trunc"

