deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SWARM_KNOWN_HOSTS" >> ~/.ssh/known_hosts

  script:
    - echo "[INFO] Preparing deployment..."
    # On crée le dossier en une seule fois
    - ssh -o StrictHostKeyChecking=accept-new ubuntu@"$SWARM_MANAGER_IP" "mkdir -p /home/ubuntu/deploy"
    # Upload du fichier stack
    - cat docker-stack.yml | ssh -o StrictHostKeyChecking=accept-new ubuntu@"$SWARM_MANAGER_IP" "cat > /home/ubuntu/deploy/docker-stack.yml"
    # Déploiement en passant les variables dynamiquement sans créer de fichier .env persistant
    # Note: Cela suppose que votre docker-stack.yml utilise des variables d'environnement
    - echo "[INFO] Deploying stack..."
    - ssh ubuntu@"$SWARM_MANAGER_IP" "
        export DB_PASSWORD='${DB_PASSWORD}';
        export STORAGE_S3_SECRET='${STORAGE_S3_SECRET}';
        export APP_KEY='${APP_KEY}';
        export S3_KEY='${S3_KEY}';
        docker stack deploy --with-registry-auth -c /home/ubuntu/deploy/docker-stack.yml bookstack
      "

    - echo "[INFO] Checking status..."
    - ssh ubuntu@"$SWARM_MANAGER_IP" "docker stack ps bookstack --no-trunc"
