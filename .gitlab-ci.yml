default:
  tags:
    - bs-runner-3

stages:
  - build
  - test
  - deploy
  - quality

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
#   PLATFORMS: linux/amd64,linux/arm64

test-units:
  stage: test
  image: composer:2
  script:
    - composer install --ignore-platform-reqs
  allow_failure: true

build:
  stage: build
  image: docker:cli
  script:
    - docker info  # Test de connexion au socket
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE -f dev/docker/Dockerfile .
    - docker push $IMAGE

